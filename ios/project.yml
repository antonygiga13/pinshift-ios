name: PinShift
options:
  bundleIdPrefix: com.pinshift
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"

targets:
  PinShift:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: PinShift
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pinshift.app
        INFOPLIST_FILE: PinShift/Info.plist
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        HEADER_SEARCH_PATHS:
          - "$(inherited)"
          - "$(PROJECT_DIR)/../rust/locbridge/include"
        SWIFT_INCLUDE_PATHS:
          - "$(inherited)"
          - "$(PROJECT_DIR)/../rust/locbridge/include"
        LIBRARY_SEARCH_PATHS:
          - "$(inherited)"
          - "$(PROJECT_DIR)/../rust/locbridge/target/aarch64-apple-ios/release"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-llocbridge"
          - "-lc++"
          - "-lresolv"
          - "-framework"
          - "Security"
          - "-framework"
          - "SystemConfiguration"
          - "-framework"
          - "MapKit"
          - "-framework"
          - "CoreLocation"
